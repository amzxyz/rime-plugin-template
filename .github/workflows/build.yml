name: Publish Evo Android APK

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

defaults:
  run:
    shell: bash

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.31.6"
  BUILD_TOOLS_VERSION: "36.0.0"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check release configuration
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_KEY" || -z "$KEY_STORE_PASSWORD" || -z "$ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Set SIGNING_KEY, KEY_STORE_PASSWORD, ALIAS, and KEY_PASSWORD."
            exit 1
          fi
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/evo-keystore.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          if ! printf '%s' "$SIGNING_KEY" | base64 -d > "$keystore"; then
            echo "::error::SIGNING_KEY must contain the Base64 of the keystore file."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass:env KEY_STORE_PASSWORD >/dev/null; then
            echo "::error::Cannot open SIGNING_KEY with KEY_STORE_PASSWORD. Check the keystore file and its store password."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass:env KEY_STORE_PASSWORD -alias "$ALIAS" >/dev/null; then
            echo "::error::ALIAS was not found in the keystore."
            exit 1
          fi

          started_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')
          release_date=$(TZ=Asia/Shanghai date --date="$started_at" +%Y.%m.%d)
          version="$release_date.$GITHUB_RUN_NUMBER"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::Release v$version already exists."
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\nAPK_NAME=librime-evo-v%s-arm64-v8a.apk\n' \
            "$version" "$version" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install NDK, CMake, and build tools
        run: |
          sdkmanager --licenses < <(yes) > /dev/null
          sdkmanager --install \
            "ndk;$NDK_VERSION" \
            "cmake;$CMAKE_VERSION" \
            "build-tools;$BUILD_TOOLS_VERSION" \
            "platforms;android-36"

      - name: Write local.properties
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          printf 'rime.ndkVersion=%s\n' "$NDK_VERSION" >> local.properties
          printf 'rime.cmakeVersion=%s\n' "$CMAKE_VERSION" >> local.properties
          printf 'rime.buildToolsVersion=%s\n' "$BUILD_TOOLS_VERSION" >> local.properties

      - name: Cache Boost source
        uses: actions/cache@v4
        with:
          path: boost_1_89_0.tar.gz
          key: boost-1.89.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build ARM64 release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PpluginVersionName="$RELEASE_VERSION" -PpluginVersionCode="$GITHUB_RUN_NUMBER"

      - name: Sign and verify the APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/evo-keystore.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 -d > "$keystore"

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected one ARM64 release APK."
            exit 1
          fi
          tools="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"
          aligned="$RUNNER_TEMP/evo-aligned.apk"
          mkdir -p dist
          apk="dist/$APK_NAME"
          "$tools/zipalign" -f -P 16 4 "${apks[0]}" "$aligned"
          "$tools/apksigner" sign --ks "$keystore" \
            --ks-key-alias "$ALIAS" --ks-pass env:KEY_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD --out "$apk" "$aligned"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" | awk -v package="name='org.rime.plugin.evo'" -v version="versionName='$RELEASE_VERSION'" -v abi="'arm64-v8a'" '
              $1 == "package:" && $2 == package && $4 == version { valid_package = 1; print }
              $1 == "native-code:" && $2 == abi && NF == 2 { valid_abi = 1; print }
              END { if (!(valid_package && valid_abi)) exit 1 }
          '
          python3 - "$apk" <<'PYTHON'
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as apk:
              libraries = {name for name in apk.namelist() if name.endswith(".so")}
              if libraries != {"lib/arm64-v8a/librime.so"}:
                  raise SystemExit(f"Unexpected libraries: {libraries}")
          PYTHON

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" "dist/$APK_NAME" \
            --target "$GITHUB_SHA" --title "Librime Evo Android v$RELEASE_VERSION" \
            --notes "适用于支持外置 Rime 引擎的 64 位 ARM Android 前端。"
